<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2ec5b6"/>
      <stop offset="1" stop-color="#1c7c74"/>
    </linearGradient>
    <linearGradient id="knob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7e3e1"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="none"
        stroke="#000000" stroke-opacity="0.14" stroke-width="2"/>

  <!-- Slider tracks -->
  <g stroke="#0c3b37" stroke-opacity="0.4" stroke-width="7" stroke-linecap="round">
    <line x1="34" y1="30" x2="34" y2="98"/>
    <line x1="55" y1="30" x2="55" y2="98"/>
    <line x1="76" y1="30" x2="76" y2="98"/>
    <line x1="97" y1="30" x2="97" y2="98"/>
  </g>

  <!-- Handles, tracing a bass-boost curve that falls away towards the treble -->
  <g fill="url(#knob)">
    <rect x="24" y="38" width="20" height="13" rx="6.5"/>
    <rect x="45" y="52" width="20" height="13" rx="6.5"/>
    <rect x="66" y="72" width="20" height="13" rx="6.5"/>
    <rect x="87" y="61" width="20" height="13" rx="6.5"/>
  </g>
</svg>
